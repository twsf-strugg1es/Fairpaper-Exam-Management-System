# Netlify: set the base directory to scrollcraft/builds/fairpaper-landing and the
# environment variable FAIRPAPER_API to the API's https:// address to enable signup.
# Without it, the site deploys in preview mode with waitlist signup disabled.
[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
